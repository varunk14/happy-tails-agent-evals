- id: X-L1
  title: Undo back to the first plan
  category: L_long_memory
  polarity: answer
  persona: Owner who explores then reverts
  turns:
  - Standard suite for Pepper, 25 lb terrier, Jan 26 to Jan 29 2027.
  - What if we did the luxury suite instead and added a nature walk?
  - Hmm, too much. Let's go back to the first plan exactly.
  checks:
  - {id: X-L1.1, at: 2, type: judge, severity: material, rule: '2.5', pass: 'Luxury 3 nights $270 + nature walk
      $25 = $295 (or Tiny Town $85 if offered for a 25 lb dog, clearly explained).'}
  - {id: X-L1.2, at: 3, type: judge, severity: material, rule: '7.3, 1.4', pass: Returns to standard suite 3 nights
      = $195 with no nature walk.}
