# Category L - long conversations. Facts given early must hold late; the chat text and the
# card must agree.

- id: L-01
  title: Nine turns - a declined add-on must stay out
  category: L_long_memory
  polarity: answer
  persona: Chatty owner who drip-feeds details
  turns:
  - Hi! Planning a stay for Oscar, he's a 30 lb corgi. Jan 26 to Jan 29, 2027.
  - Standard suite please.
  - No extras for now. And definitely NOT the exit bath, he hates baths.
  - What time do you open on weekdays?
  - Actually can we make it Jan 26 to Jan 30?
  - And add one ball/tug session.
  - Does his bordetella need to be current?
  - He has a sensitive tummy so I'll bring his own food.
  - Ok, remind me what's in the plan now and the total?
  checks:
  - {id: L-01.1, at: 4, type: judge, severity: material, rule: '7.4', pass: 'Weekday opening time is 7:00am.'}
  - {id: L-01.2, at: 9, type: judge, severity: material, rule: '7.3, 2.5', pass: 'Plan: standard suite, Jan 26 to
      Jan 30 = 4 nights = $260, plus one ball/tug session $25 = $285.'}
  - {id: L-01.3, at: 9, type: judge, severity: material, rule: '7.3', pass: The exit bath is not in the plan.}
  - {id: L-01.4, at: 9, type: judge, severity: material, rule: '7.3', pass: The total in the chat text and the total
      on the plan/card agree.}
  - {id: L-01.5, at: 7, type: judge, severity: material, rule: '4.1', pass: 'Yes, bordetella must be current (within
      6-12 months); mentioning the one-week record deadline is welcome but not required.'}
  - {id: L-01.6, at: 9, type: judge, severity: service, rule: '1.1, 1.2', pass: 'The plan/estimate appears on the
      page (card text), labelled with the pet''s name and showing the dates.'}

- id: L-02
  title: Seven turns - suite and dates flip-flop
  category: L_long_memory
  polarity: answer
  persona: Indecisive owner
  turns:
  - Need a luxury suite for my malamute Atlas, 85 lbs, Feb 2 to Feb 5 2027.
  - Hmm, make it Feb 1 to Feb 5.
  - Add a full groom before pick up.
  - Actually switch to the standard suite to save money.
  - And add 2 nature walks.
  - You know what, go back to luxury but keep everything else.
  - What's my total, and is anything not included in it?
  checks:
  - {id: L-02.1, at: 2, type: judge, severity: material, rule: '2.5', pass: Feb 1 to Feb 5 is 4 nights; luxury =
      $360.}
  - {id: L-02.2, at: 3, type: judge, severity: material, rule: '2.2', pass: 'The groom for an 85 lb dog is the XLarge
      (81-99 lb) starting price $105+, shown as a minimum.'}
  - {id: L-02.3, at: 7, type: judge, severity: material, rule: '7.3, 2.5, 1.3', pass: 'Firm items: luxury 4 nights
      $360 + 2 nature walks $50 = $410; the groom is either excluded and listed as from $105, or the total is presented
      as a minimum (from $515), never as a fixed $515.'}
  - {id: L-02.4, at: 7, type: judge, severity: material, rule: '7.3', pass: 'The chat text and the plan/card agree
      on the suite, dates and total.'}
