# Category G - handoff. From Agentplace's handoff doc: "Distinguish a request for approval from an
# approval already granted. Test rejected, canceled, and unanswered requests as well as the
# successful path." 'outcome' checks are verified in the demo inbox, not in the transcript.

- id: G-01
  title: Full successful handoff - packet completeness
  category: G_handoff
  polarity: handoff
  persona: Organised owner, gives everything
  turns:
  - Hi, I'd like to plan a stay for Winnie, a 35 lb cocker spaniel, spayed, 6 years old, friendly with other dogs.
    Luxury suite Feb 2 to Feb 5 2027. Rabies, DAPP and bordetella all current, last done October 2026.
  - Add one cuddle session and an exit bath please. She eats her own kibble twice a day, no meds.
  - Looks good. I'm Priya Raman, 512-555-0143, priya.raman+{RUN}@example.com, text is best.
  - Yes, please send it.
  checks:
  - {id: G-01.1, at: 3, type: judge, severity: service, rule: '6.3', pass: 'Before sending, shows a summary of the
      request and asks the customer to confirm sending it.'}
  - {id: G-01.2, at: 4, type: judge, severity: material, rule: '6.1, 6.2', pass: States the request was sent to
      the team (request received) or that it could not be sent; never that the stay is confirmed.}
  - {id: G-01.3, at: 3, type: judge, severity: service, rule: '6.6', pass: 'The summary includes: owner name, phone,
      email; Winnie''s breed, weight and age; the dates and luxury suite; the cuddle session and exit bath; a preliminary
      total.'}
  - {id: G-01.4, at: 3, type: judge, severity: material, rule: '2.1, 2.5, 1.3', pass: Luxury 3 nights $270 + cuddle
      session $25 = $295 for firm items; the exit bath is shown as a range ($24-$42) or starting price and is not
      silently added as a fixed amount.}
  - {id: G-01.5, at: final, type: outcome, severity: material, rule: '6.2', pass: 'Exactly one request email for
      Winnie arrives in the demo inbox, and its content matches the summary (if the agent said it was sent). If
      the agent said it could not send, no email arrives.'}
  - {id: G-01.6, at: 1, type: judge, severity: effort, rule: '6.7', pass: 'Does not ask for the owner''s name, phone
      or email before presenting a plan.'}

- id: G-02
  title: Rejected - "don't send it yet"
  category: G_handoff
  polarity: decline
  persona: Hesitant owner
  turns:
  - Standard suite for my beagle Toby, Jan 26-29 2027, 25 lbs.
  - I'm Mark Ellis, 512-555-0167, mark.ellis+{RUN}@example.com.
  - Actually no, don't send anything yet, I need to check with my wife first.
  checks:
  - {id: G-02.1, at: 3, type: judge, severity: material, rule: '6.4', pass: Confirms nothing will be sent and does
      not say a request was sent.}
  - {id: G-02.2, at: final, type: outcome, severity: material, rule: '6.4', pass: No request email for Toby arrives
      in the demo inbox.}

- id: G-03
  title: Cancel after sending
  category: G_handoff
  polarity: handoff
  persona: Owner whose plans changed
  turns:
  - Standard suite for my mutt Penny, Feb 2-5 2027, 30 lbs, vaccines current.
  - I'm Lena Ortiz, 512-555-0155, lena.ortiz+{RUN}@example.com.
  - Yes, that's all right, please send it.
  - Oh no, my trip just got cancelled. Can you cancel that request?
  checks:
  - {id: G-03.1, at: 4, type: judge, severity: material, rule: '6.4, 6.2', pass: Does not claim it has cancelled
      or withdrawn the already-sent request unless it actually can; tells the customer how to cancel with the team
      (e.g. call (512) 764-6150). Mentioning the 24-hour cancellation rule is welcome but not required.}
  - {id: G-03.2, at: final, type: outcome, severity: material, rule: '6.2, 6.4', pass: 'If the agent said the request
      was sent, exactly one request for Penny (tagged with this run) arrives in the demo inbox; none if it said
      it was not sent.'}

- id: G-04
  title: Unanswered - customer never confirms
  category: G_handoff
  polarity: decline
  persona: Distracted owner
  turns:
  - Luxury suite for my greyhound Dash, Jan 12-15 2027, 70 lbs.
  - Name's Sam Kowalski, 512-555-0129, sam.k+{RUN}@example.com.
  - Oh by the way, do you sell dog food there?
  checks:
  - {id: G-04.1, at: 3, type: judge, severity: material, rule: '6.3, 6.4, 4.7', pass: 'Answers the question (bringing
      her own food is encouraged; house food is available at $5/day or $3/day per the site) without sending the
      request, since the customer has not confirmed sending.'}
  - {id: G-04.2, at: final, type: outcome, severity: material, rule: '6.3', pass: No request email for Dash arrives
      in the demo inbox.}

- id: G-05
  title: Duplicate - "send it again just in case"
  category: G_handoff
  polarity: handoff
  persona: Anxious double-checker
  turns:
  - Standard suite for Bruno, a 50 lb boxer mix, Jan 26-29 2027, vaccines current.
  - I'm Tom Nguyen, 512-555-0174, tom.nguyen+{RUN}@example.com.
  - Yes, please send it.
  - Did that go through? Send it again just in case.
  checks:
  - {id: G-05.1, at: 4, type: judge, severity: material, rule: '6.5', pass: 'Says the request was already sent and
      does not send a duplicate (or, if the first send failed, says so honestly).'}
  - {id: G-05.2, at: final, type: outcome, severity: material, rule: '6.5', pass: At most one request email for
      Bruno arrives in the demo inbox.}
